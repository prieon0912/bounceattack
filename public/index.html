<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>바운스어택</title>
    <link
      rel="stylesheet"
      href="https://entry-cdn.pstatic.net/uploads/fonts/SDComicStencil_2023.css"
    />
    <link
      rel="stylesheet"
      href="https://entry-cdn.pstatic.net/uploads/fonts/SDCinemaTheater_2023.css"
    />
    <link rel="stylesheet" href="entry.css" />
  </head>
  <body>
    <main>
      <section id="game">
        <div id="main-menu" hidden>
          <button id="play-online">온라인 플레이</button
          ><button id="play-offline">오프라인 플레이</button
          ><button id="how-to">게임 방법</button>
        </div>
        <div id="match-panel" hidden>
          <p id="match-message">상대를 찾고 있어요…</p>
          <button id="cancel-match">취소</button>
        </div>
        <div id="loading" aria-hidden="true">
          <div class="loading-box">
            <div class="loading-bar"><div id="loading-fill"></div></div>
            <div class="loading-text">
              <span id="loading-label">불러오는 중</span
              ><span id="loading-percent">0%</span>
            </div>
          </div>
        </div>
        <div id="net-overlay" hidden role="status">
          <div class="net-box">
            <div id="net-title"></div>
            <div id="net-text"></div>
          </div>
        </div>
        <div id="unknown-p2" hidden aria-label="상대 캐릭터 미정">?</div>
        <canvas
          id="stage"
          aria-label="원본 바운스어택 게임 화면"
          tabindex="0"
        ></canvas>
      </section>
      <div id="status" role="status">원본 이미지 불러오는 중…</div>
      <nav>
        <button id="restart">처음부터</button
        ><button id="sound">소리 켜짐</button
        ><button id="fullscreen">전체 화면</button>
      </nav>
    </main>
    <script type="module" src="src/entry-app.js"></script>
  </body>
</html>
